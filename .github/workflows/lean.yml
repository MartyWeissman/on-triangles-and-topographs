name: Lean verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check lessons, dependency pins, and foundational axioms
        run: ./scripts/verify.sh
      - name: Confirm the dependency lock was preserved
        run: git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.toml
